[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provenance-ai"
version = "0.1.0"
description = "The living memory of why your code exists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "fastmcp>=2.0.0",
    "chromadb>=0.6.0",
    "gitpython>=3.1.40",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
]

[project.scripts]
provenance = "provenance.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["provenance"]
