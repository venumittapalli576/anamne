[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamne"
version = "0.9.0"
description = "Brain-inspired personal memory layer for AI tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Venu Mittapalli" }]
keywords = [
    "memory", "ai", "llm", "mcp", "claude", "cursor",
    "personal-knowledge", "episodic-memory", "local-first"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.49.0",
    "google-genai>=1.0.0",
    "fastmcp>=2.0.0",
    "chromadb>=0.6.0",
    "gitpython>=3.1.40",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/venumittapalli576/anamne"
Repository = "https://github.com/venumittapalli576/anamne"
"Bug Tracker" = "https://github.com/venumittapalli576/anamne/issues"

[project.scripts]
anamne = "anamne.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["anamne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
